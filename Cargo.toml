[package]
name = "kickit"
version = "0.1.1"
description = "A robust & simple init system"
repository = "https://github.com/h4dynn/kickit"
readme = "README.md"
license = "GPL-3.0-or-later"
default-run = "kickit"
edition = "2024"

[dependencies]
# toml needs serde::Deserialize
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.9.5"
tokio = { version = "1.47.1", features = ["full", "io-util"] }
chrono = "0.4.42"
nix = { version = "0.30.1", features = ["user", "fs", "process", "signal", "mount", "reboot"] }
thiserror = "2.0.17"
ruzstd = "0.8.3"
# Optional- debug memory heap analysis
dhat = { version = "0.3.3", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
debug = false
strip = "symbols"
opt-level = 3
codegen-units = 16
lto = "fat"

[profile.dev]
debug = 1
strip = "none"

[features]
# Bypass function that checks if pid 1 is kickit
# (use this only for debugging since it may cause unexplained errors)
bypass_init_check = []
# Use POSIX shell (/bin/sh) instead of bash
posix_sh = []
# Use the dhat heap profiler - for debugging memory usage
dhat_heap = ["dhat"]

[[bin]]
# The init program- install to /usr/lib/kickit/kickit & symlink to /usr/sbin/init
name = "kickit"
path = "src/init/kickit.rs"

[[bin]]
name = "ktctl"
path = "src/ktctl/ktctl.rs"
