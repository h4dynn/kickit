[package]
name = "kickit"
version = "26.7.1"
description = "A robust & simple init system"
repository = "https://github.com/h4dynn/kickit"
readme = "README.md"
license = "GPL-3.0-or-later"
default-run = "kickit"
edition = "2024"

[dependencies]
# toml needs serde::Deserialize
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.9.5"
tokio = { version = "1.47.1", features = ["fs", "time", "net", "io-util", "rt-multi-thread", "macros"] }
chrono = "0.4.42"
nix = { version = "0.30.1", features = ["fs", "user", "reboot", "process", "signal", "mount", "sched"] }
ruzstd = "0.8.3"
# Optional- debug memory heap analysis
dhat = { version = "0.3.3", optional = true }
derive_more = { version = "2.1.1", features = ["display"] }
thiserror = "2.0.18"

[lib]
crate-type = ["rlib"]

[profile.release]
debug = false
strip = "symbols"
opt-level = 3
codegen-units = 16
lto = "fat"

[profile.dev]
debug = 1
strip = "none"

[features]
# Bypass function that checks if pid 1 is kickit
# (use this only for debugging since it may cause unexplained errors)
bypass_init_check = []
# Use the dhat heap profiler - for debugging memory usage
dhat_heap = ["dhat"]
# Stable release
stable = []

[[bin]]
# The init program- install to /usr/lib/kickit/kickit & symlink to /usr/sbin/init
name = "kickit"
path = "src/init/kickit.rs"

[[bin]]
name = "warden"
path = "src/init/warden.rs"

[[bin]]
name = "ktctl"
path = "src/ktctl/ktctl.rs"
