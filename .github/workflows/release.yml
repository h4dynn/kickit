name: Build release

on: [push, workflow_dispatch]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Fetch xbps-src
        run: |
          cd package
          ./xbps-src-setup.sh

      - name: Fetch xbps binaries
        run: |
          mkdir -m0755 ~/.xbps
          curl -#Lo- http://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz | unxz | tar -xC ~/.xbps

      - name: Build kickit (unstable)
        if: ${{ startsWith(github.event.head_commit.message, 'release') }}
        run: |
          export PATH=$HOME/.xbps/usr/bin:$PATH
          # workaround for "/run/self/uid_map: Operation not permitted"
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          cd package
          rm -rf kickit
          mv unstable kickit
          ./xbps-src pkg kickit

      - name: Build kickit (stable)
        if: ${{ startsWith(github.event.head_commit.message, 'release') }}
        run: |
          export PATH=$HOME/.xbps/usr/bin:$PATH
          # workaround for "/run/self/uid_map: Operation not permitted"
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          cd package
          ./xbps-src pkg kickit

      - name: Create release (pre-release)
        if: ${{ !startsWith(github.event.head_commit.message, 'release') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          mv -v package/hostdir/binpkgs/main/*.xbps .
          gh release create "unstable-$(date +%s)" *.xbps -F CHANGELOG.md -R "h4dynn/kickit" -t "$(date +"%d %b %Y, %H:%M")" -p

      - name: Create release
        if: ${{ startsWith(github.event.head_commit.message, 'release') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          version="$(grep -w '^version = .*$' Cargo.toml | cut -d'"' -f2)"
          mv -v package/hostdir/binpkgs/main/*.xbps .
          { cat ./docs/Installation.md; echo; echo "# Changelog"; echo; cat ./CHANGELOG.md; } > notes.md
          gh release create "$version" *.xbps -F notes.md -R "h4dynn/kickit" -t "Release $version" --latest

      - name: Fetch artifacts
        uses: actions/download-artifact@v6

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: release
          path: ./*.xbps
