name: Build release

on: [push, workflow_dispatch]

jobs:
  release:
    if: (${{ github.event_name == 'push' }} && contains(github.event.head_commit.message, '\(release\)')) || (${{ github.event_name == 'workflow_dispatch' }})
    name: Build release
    uses: ./.github/workflows/build.yml
    with:
      release: true
