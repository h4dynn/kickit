name: Build

on:
  workflow_call:
    inputs:
      release:
        description: 'Build release variant instead of debug'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get rust toolkit
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | bash -s -- -y

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Build (debug)
        if: ${{ inputs.release == false }}
        run: cargo build

      - name: Build (release)
        if: ${{ inputs.release }}
        run: cargo build --release

      - name: Fetch artifacts
        uses: actions/download-artifact@v6

      - name: Upload artifacts (debug)
        if: ${{ inputs.release == false }}
        uses: actions/upload-artifact@v5
        with:
          name: debug
          path: target/debug/*

      - name: Upload artifacts (release)
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@v5
        with:
          name: release
          path: target/release/*
